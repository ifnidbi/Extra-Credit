{% extends "base.html" %}
{% block title %}Account · ExtraCredit{% endblock %}
{% block content %}
<h1>Account</h1>
{% set person = viewer() %}
<p>{{ person.email }} · {{ person.role }}</p>
<p>{{ person.school_name }}</p>
<form class="stack narrow" data-api-form="/api/account" data-method="PUT" data-success="Profile updated.">
    <label>Full name <input name="full_name" maxlength="100" required value="{{ person.full_name }}"></label>
    <button>Save profile</button>
    <p role="status" data-message></p>
</form>
{% if person.role == 'user' %}
<h2>Deactivate account</h2>
<form class="stack narrow" data-api-form="/api/account" data-method="DELETE" data-action="sign-out"
      data-confirm="Deactivate your account and hide your listings?">
    <label>Current password <input type="password" name="password" autocomplete="current-password" required></label>
    <button>Deactivate account</button>
    <p role="status" data-message></p>
</form>
{% endif %}
{% endblock %}
